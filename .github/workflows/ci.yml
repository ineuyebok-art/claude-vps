name: CI
on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run: bash tests/shellcheck.sh

  bot-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: python3 --version
      - run: python3 -m unittest discover -s tests -t . -v

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: pwsh
        run: ./tests/ps-analyze.ps1
      - name: Windows smoke test
        shell: powershell
        run: ./tests/windows-smoke.ps1
